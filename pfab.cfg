# ============================================================================
# PFAB / reference-based purge algorithm for Klipper + Happy Hare v4
# Single-file replacement for the user's existing pfab.cfg
# ============================================================================
# Mechanical coordinates PRESERVED from the original PFAB setup:
#   purge X252 | brush left X237 | anti-drip X249
#   wipe stroke: 15 mm, fast LEFT / slow RIGHT (required for release)
#
# The purge algorithm follows the reference printer's *public change-filament G-code*:
#   adaptive sections (~135 mm^3 each, max 4 unless PFAB's 90-mm safety
#   limit requires more); 23.7 mm initial fast segment; alternating fast/slow
#   extrusion; 60/255 fan during extrusion; 178/255 + 3s before wiping;
#   3 intermediate wipes on qualifying sections, 4 at the end;
#   print-temperature restoration and final +6 mm ooze compensation.
# Differences needed for this printer: 15 mm wipe; configurable flow/accel
# caps; Happy Hare expects the parked retraction level to be preserved.
#
# REQUIRED ONCE PER PRINT (OrcaSlicer printer start G-code):
# Place AFTER the normal MMU_START_SETUP (if present) and BEFORE loading tool 0.
#    PFAB_JOB_BEGIN
#    PFAB_SET_PROFILE TOOL={initial_extruder} FLUSH_TEMP={flush_temperatures[initial_extruder]} FLOW={flush_volumetric_speeds[initial_extruder]} PRINT_TEMP={nozzle_temperature[initial_extruder]} RETRACT={retract_length_toolchange[initial_extruder]}
#
# REQUIRED ON FILAMENT CHANGE (OrcaSlicer printer change-filament G-code):
# Place BEFORE the existing T[next_extruder] command; leave T calls untouched.
#    PFAB_SET_PROFILE TOOL={next_extruder} FLUSH_TEMP={flush_temperatures[next_extruder]} FLOW={flush_volumetric_speeds[next_extruder]} PRINT_TEMP={new_filament_temp} RETRACT={new_retract_length_toolchange}
#
# These are slicer placeholders, NOT Klipper/Jinja macro expressions. Do not
# uncomment them in this config file; paste in OrcaSlicer as instructed.
# PFAB_SET_PROFILE now ALSO saves the profile against the current HH tool->gate
# and spool identity (in [save_variables], pfab_gate_profiles). Printing uses
# the current job's Orca profile, independent of the persistent entry.
# Outside printing, PFAB resolves a matching saved gate/spool profile; if none
# matches, it chooses a conservative material-specific fallback below.
# No NFC/RFID identity checks: tags may be reused on different spools.
# No changes to OrcaSlicer T0/T1/T2/T3, HH callbacks or original hooks.
# Existing Happy Hare macros MUST still point to the names below (no changes to
# their call sites), with purge_macro=_PFAB_PURGE and standalone purge enabled.
# Disable the OrcaSlicer prime/wipe tower if Happy Hare standalone purge is used.
#
# HEATER SAFETY: OrcaSlicer flush temperature must be within the Klipper
# [extruder] min_temp/max_temp limits. A generic material profile can request
# temperatures that a stock Ender 3 hotend must NOT use. This macro stops with
# an explicit error instead of clamping temperatures behind the user's back.
# FLOW SAFETY: purge_speed caps volumetric flow to 10 mm^3/s by default,
# because a normal 0.4mm nozzle must not be assumed to handle the reference printer's flow rates.
# Raise only after measuring the actual sustainable flow of your hotend.
# ============================================================================

[virtual_pins]

[temperature_sensor PFAB_Bucket_Percentage]
sensor_type: AD8494
sensor_pin: virtual_pin:PFAB_BCUKET_LEVEL_pin
adc_voltage: 5
voltage_offset: 0
#min_temp: 0
#max_temp: 100

[gcode_macro UPDATE_PFAB_BUCKET_VPIN]
variable_low: 0.0000021763
variable_high: 0.0000030039
gcode:
    {% set p = params.PERCENT|float %}
    {% set val = low + (p / 100.0) * (high - low) %}
    SET_VIRTUAL_PIN PIN=PFAB_BCUKET_LEVEL_pin VALUE={val}

# ---------------------------------------------------------------------------
# LIVE + PERSISTED SLICER PROFILES. One source of truth per context:
#   in print    => fresh Orca profile from _PFAB_PROFILE.profiles
#   out of print=> matching saved profile by physical gate AND filament ID
#   unknown/new => generic type fallback, never stale profile from old spool
# File persistence uses the existing [save_variables] facility / same file as
# the existing bucket counter. Nothing changes in PFAB_JOB_BEGIN usage.
# ---------------------------------------------------------------------------
[gcode_macro _PFAB_PROFILE]
variable_profiles: {}
variable_job_ready: 0
# Conservative, user-tunable fallbacks, NOT the reference slicer's exact filament presets.
# temp = flush temperature, print_temp = backup print temperature, flow mm^3/s.
# gate_temperature takes priority for print_temp whenever Happy Hare knows it.
# Always respect the filament manufacturer's safe temperature/flow limits.
variable_fallback_profiles: {
      'PLA':  {'temp': 220.0, 'print_temp': 215.0, 'flow': 8.0, 'retract': 2.0},
      'PETG': {'temp': 240.0, 'print_temp': 235.0, 'flow': 6.0, 'retract': 2.0},
      'ABS':  {'temp': 245.0, 'print_temp': 245.0, 'flow': 8.0, 'retract': 2.0},
      'ASA':  {'temp': 245.0, 'print_temp': 245.0, 'flow': 8.0, 'retract': 2.0},
      'TPU':  {'temp': 215.0, 'print_temp': 215.0, 'flow': 3.0, 'retract': 1.0},
      'TPE':  {'temp': 215.0, 'print_temp': 215.0, 'flow': 3.0, 'retract': 1.0},
      'PA':   {'temp': 250.0, 'print_temp': 250.0, 'flow': 5.0, 'retract': 2.0},
      'PC':   {'temp': 250.0, 'print_temp': 250.0, 'flow': 5.0, 'retract': 2.0},
      'PVA':  {'temp': 205.0, 'print_temp': 205.0, 'flow': 3.0, 'retract': 1.0},
      'HIPS': {'temp': 235.0, 'print_temp': 235.0, 'flow': 6.0, 'retract': 2.0}
    }
gcode:
    RESPOND MSG="PFAB: use PFAB_JOB_BEGIN / PFAB_SET_PROFILE; saved profiles survive restart"

[gcode_macro PFAB_JOB_BEGIN]
description: Reset ONLY per-job Orca profiles; do not erase persistent gate profiles
gcode:
    SET_GCODE_VARIABLE MACRO=_PFAB_PROFILE VARIABLE=profiles VALUE="{dict()}"
    SET_GCODE_VARIABLE MACRO=_PFAB_PROFILE VARIABLE=job_ready VALUE=1
    RESPOND MSG="PFAB: new print: cleared live profile cache, saved gate/spool profiles kept"

[gcode_macro PFAB_SET_PROFILE]
description: Set fresh Orca profile for Tn; also persist it for the mapped gate/spool
gcode:
    {% set tool = params.TOOL|default(-1)|int %}
    {% set temp = params.FLUSH_TEMP|default(0)|float %}
    {% set flow = params.FLOW|default(0)|float %}
    {% set print_temp = params.PRINT_TEMP|default(0)|float %}
    {% set retract = params.RETRACT|default(0)|float %}
    {% if tool < 0 or tool > 99 %}
        {action_raise_error("PFAB: PFAB_SET_PROFILE requires TOOL=0..99")}
    {% endif %}
    {% if temp <= 0 or flow <= 0 or print_temp <= 0 or retract < 0 %}
        {action_raise_error("PFAB: invalid FLUSH_TEMP / FLOW / PRINT_TEMP / RETRACT")}
    {% endif %}
    {% set profile = {'temp': temp, 'flow': flow, 'print_temp': print_temp, 'retract': retract} %}
    {% set db = printer['gcode_macro _PFAB_PROFILE'].profiles|default({}) %}
    {% set updated = db.copy() %}
    {% set unused = updated.update({tool|string: profile}) %}
    SET_GCODE_VARIABLE MACRO=_PFAB_PROFILE VARIABLE=profiles VALUE="{updated}"
    SET_GCODE_VARIABLE MACRO=_PFAB_PROFILE VARIABLE=job_ready VALUE=1

    # Map slicer TOOL to physical GATE, not a fixed Tn->Gn assumption.
    # NFC/RFID tags may be reused; never use tag ID for persisted matching.
    # Prefer Spoolman spool ID, otherwise use filament metadata.
    {% set mmu = printer.mmu %}
    {% set map = mmu.ttg_map|default([]) %}
    {% set gate = map[tool]|int if tool < map|length else -1 %}
    {% if gate >= 0 and gate < mmu.gate_material|length %}
        {% set mat = mmu.gate_material[gate]|default('')|string|upper|trim %}
        {% set vendor = mmu.gate_vendor[gate]|default('')|string|upper|trim %}
        {% set name = mmu.gate_filament_name[gate]|default('')|string|upper|trim %}
        {% set color = mmu.gate_color[gate]|default('')|string|upper|trim %}
        {% set temp_gate = mmu.gate_temperature[gate]|default(0)|float %}
        {% set spool = mmu.gate_spool_id[gate]|default(-1)|int %}
        {% if spool > 0 %}
            {% set identity = 'spool:' ~ (spool|string) %}
        {% elif mat and (name or color or vendor) %}
            {% set identity = 'meta:' ~ mat ~ '|' ~ vendor ~ '|' ~ name ~ '|' ~ color ~ '|' ~ (temp_gate|string) %}
        {% else %}
            {% set identity = '' %}
        {% endif %}
        {% if identity %}
            {% set persistent = printer.save_variables.variables.pfab_gate_profiles|default({}) %}
            {% set store = persistent.copy() %}
            {% set unused = store.update({gate|string: {'identity': identity, 'profile': profile}}) %}
            SAVE_VARIABLE VARIABLE=pfab_gate_profiles VALUE="{store}"
            RESPOND MSG="PFAB: saved T{tool} as gate {gate} filament profile; persistent across restarts"
        {% else %}
            RESPOND MSG="PFAB: T{tool}/gate {gate} missing spool identity and detailed filament metadata; live print profile set but not persisted"
        {% endif %}
    {% else %}
        RESPOND MSG="PFAB: T{tool} not mapped to a valid gate; live print profile set but not persisted"
    {% endif %}

[gcode_macro PFAB_FORGET_GATE]
description: Remove a saved profile when changing an indistinguishable spool without a Spoolman ID
gcode:
    {% set gate = params.GATE|default(-1)|int %}
    {% set data = printer.save_variables.variables.pfab_gate_profiles|default({}) %}
    {% if gate < 0 %}
        {action_raise_error("PFAB: use PFAB_FORGET_GATE GATE=<number>")}
    {% endif %}
    {% set updated = data.copy() %}
    {% if gate|string in updated %}
        {% set unused = updated.pop(gate|string) %}
        SAVE_VARIABLE VARIABLE=pfab_gate_profiles VALUE="{updated}"
        RESPOND MSG="PFAB: forgotten stored gate {gate} profile. Next standalone purge uses material fallback"
    {% else %}
        RESPOND MSG="PFAB: no stored profile for gate {gate}"
    {% endif %}

# ---------------------------------------------------------------------------
# PFAB purge routine: operator-visible macro name and variables retained for the
# existing Happy Hare integration and bucket counter.
# ---------------------------------------------------------------------------
[gcode_macro _PFAB_PURGE]
# Existing PFAB public variables and physical positions.
variable_brush_left_pos: 237
variable_brush_speed: 300         # reference fast wipe speed, mm/s
variable_brush_cycles: 4         # final wipe cycles
variable_pause: 3000            # cooling dwell, ms
variable_min_purge: 70          # PFAB mechanical minimum TOTAL filament length, mm
variable_max_blob_size: 90      # safety cap on a purge section, mm of filament
variable_min_blob_size: 70      # legacy compatibility; reference routine divides by volume
variable_fan_speed: 178         # reference fan while breaking the blob (0..255)
variable_flush_pos: 252
variable_temp_drop: 0           # legacy compatibility; the routine uses explicit flush temp
variable_purge_speed: 10.0      # max sustainable purge flow, mm^3/s (conservative)
variable_anti_drip_pos: 249
variable_max_blobs: 450
# PFAB purge routine constants.
variable_pfab_purge_unit_volume: 135.0
variable_pfab_max_parts: 4
variable_pfab_initial_straight_len: 23.7
variable_pfab_purge_fan: 60
variable_pfab_slow_speed: 50      # mm/s for return stroke
variable_pfab_accel: 9000         # mm/s^2; clamped to Klipper max_accel
variable_pfab_ooze_compensation: 6.0
variable_pfab_inter_cycles: 3
variable_pfab_retract_speed: 30   # mm/s
variable_pfab_unretract_speed: 5  # mm/s
gcode:
    {% set diameter = printer.configfile.config.extruder.filament_diameter|default(1.75)|float %}
    {% set area = 3.141592653589793 * diameter * diameter / 4.0 %}
    {% set mmu = printer.mmu %}
    {% set tool = params.TOOL|default(mmu.tool|default(-1))|int %}
    {% set prev = mmu.last_tool|default(-1)|int %}
    {% set mmu_state = mmu.print_state|default('ready')|string %}
    {% set in_print = mmu_state in ['started','printing','paused','pause_locked'] %}
    {% set profiles = printer['gcode_macro _PFAB_PROFILE'].profiles|default({}) %}
    {% set persistent = printer.save_variables.variables.pfab_gate_profiles|default({}) %}
    {% set fallbacks = printer['gcode_macro _PFAB_PROFILE'].fallback_profiles %}
    {% set map = mmu.ttg_map|default([]) %}

    # Resolve BOTH old and new materials; first reference pulse uses the OLD filament
    # flow, and first tip retract uses OLD filament toolchange retract.
    # The Jinja namespace survives iteration scoping (standard Klipper Jinja).
    {% set found = namespace(new={}, old={}, new_source='', old_source='') %}
    {% for t in [tool, prev] %}
        {% set gate = map[t]|int if t >= 0 and t < map|length else -1 %}
        {% set matched = {} %}
        {% set source = 'none' %}
        {% if gate >= 0 and gate < mmu.gate_material|length %}
            {% set mat = mmu.gate_material[gate]|default('')|string|upper|trim %}
            {% set vendor = mmu.gate_vendor[gate]|default('')|string|upper|trim %}
            {% set name = mmu.gate_filament_name[gate]|default('')|string|upper|trim %}
            {% set color = mmu.gate_color[gate]|default('')|string|upper|trim %}
            {% set temp_gate = mmu.gate_temperature[gate]|default(0)|float %}
            {% set spool = mmu.gate_spool_id[gate]|default(-1)|int %}
            {% if spool > 0 %}
                {% set identity = 'spool:' ~ (spool|string) %}
            {% elif mat and (name or color or vendor) %}
                {% set identity = 'meta:' ~ mat ~ '|' ~ vendor ~ '|' ~ name ~ '|' ~ color ~ '|' ~ (temp_gate|string) %}
            {% else %}
                {% set identity = '' %}
            {% endif %}
        {% else %}
            {% set mat = '' %}
            {% set temp_gate = 0 %}
            {% set identity = '' %}
        {% endif %}

        {% if in_print and t|string in profiles %}
            # During printing the LIVE slicer value always has precedence.
            {% set matched = profiles[t|string] %}
            {% set source = 'slicer-live' %}
        {% elif identity and gate|string in persistent and persistent[gate|string].get('identity','') == identity %}
            # Outside printing (or if the live profile has not arrived) use the
            # stored values only if SAME physical filament is still in gate.
            {% set matched = persistent[gate|string].get('profile',{}) %}
            {% set source = 'saved-gate' %}
        {% elif mat %}
            # New spool / unrecognised gate => MATERIAL-SPECIFIC FALLBACK.
            {% set normalized = mat|replace('_','-')|replace(' ','') %}
            {% if normalized.startswith('PLA') %}
                {% set family = 'PLA' %}
            {% elif normalized.startswith('PETG') or normalized.startswith('PCTG') or normalized == 'PET' %}
                {% set family = 'PETG' %}
            {% elif normalized.startswith('ABS') %}
                {% set family = 'ABS' %}
            {% elif normalized.startswith('ASA') %}
                {% set family = 'ASA' %}
            {% elif normalized.startswith('TPU') %}
                {% set family = 'TPU' %}
            {% elif normalized.startswith('TPE') %}
                {% set family = 'TPE' %}
            {% elif normalized.startswith('PA') or normalized.startswith('NYLON') %}
                {% set family = 'PA' %}
            {% elif normalized.startswith('PC') %}
                {% set family = 'PC' %}
            {% elif normalized.startswith('PVA') %}
                {% set family = 'PVA' %}
            {% elif normalized.startswith('HIPS') %}
                {% set family = 'HIPS' %}
            {% else %}
                {% set family = '' %}
            {% endif %}
            {% if family in fallbacks %}
                {% set matched = fallbacks[family].copy() %}
                # Gate temperature is the current filament's recorded print
                # temperature; avoid accidentally using a different material's.
                {% if temp_gate > 0 %}
                    {% set unused = matched.update({'print_temp': temp_gate}) %}
                {% endif %}
                {% set source = 'fallback:' ~ family %}
            {% endif %}
        {% endif %}
        {% if t == tool %}
            {% set found.new = matched %}
            {% set found.new_source = source %}
        {% elif t == prev %}
            {% set found.old = matched %}
            {% set found.old_source = source %}
        {% endif %}
    {% endfor %}

    {% set to_profile = found.new %}
    {% set from_profile = found.old if found.old else to_profile %}
    # Explicit manual overrides still win for diagnostics, like before.
    {% if not to_profile and (params.FLUSH_TEMP is not defined or params.FLOW is not defined or params.PRINT_TEMP is not defined) %}
        {action_raise_error("PFAB: no saved/slicer/fallback profile for T%d. Check Happy Hare gate material or pass FLUSH_TEMP, FLOW, PRINT_TEMP" % tool)}
    {% endif %}
    {% set flush_temp = params.FLUSH_TEMP|default(to_profile.get('temp', 0))|float %}
    {% set requested_flow = params.FLOW|default(to_profile.get('flow', 0))|float %}
    {% set print_temp = params.PRINT_TEMP|default(to_profile.get('print_temp', 0))|float %}
    {% set new_retract = params.RETRACT|default(to_profile.get('retract', 0))|float %}
    {% set old_retract = from_profile.get('retract', new_retract)|float %}
    {% set old_flow = from_profile.get('flow', requested_flow)|float %}
    {% if flush_temp <= 0 or requested_flow <= 0 or print_temp <= 0 or new_retract < 0 or old_retract < 0 %}
        {action_raise_error("PFAB: invalid material profile for purge")}
    {% endif %}
    {% set hw_max_temp = printer.configfile.settings.extruder.max_temp|float %}
    {% set hw_min_temp = printer.configfile.settings.extruder.min_temp|float %}
    {% if flush_temp >= hw_max_temp or print_temp >= hw_max_temp or flush_temp < hw_min_temp or print_temp < hw_min_temp %}
        {action_raise_error("PFAB: slicer flush/print temperature outside Klipper extruder min/max range. Fix material profile or hotend configuration before printing")}
    {% endif %}
    {% if purge_speed <= 0 or diameter <= 0 or max_blob_size <= 0 or pfab_purge_unit_volume <= 0 %}
        {action_raise_error("PFAB: invalid PFAB purge-flow or sizing configuration")}
    {% endif %}
    {% set high_flow = [requested_flow, purge_speed]|min %}
    {% set first_flow = [old_flow, purge_speed]|min %}
    {% set flow_fast = high_flow / area * 60.0 %}
    {% set flow_first = first_flow / area * 60.0 %}
    {% set park = printer['gcode_macro _MMU_PARK'] %}
    {% set seq = printer['gcode_macro _MMU_SEQUENCE_VARS'] %}
    {% set park_retract = [park.retracted_length|default(0)|float, 0]|max %}
    {% set nominal_volume = mmu.toolchange_purge_volume|default(0)|float %}
    {% set nominal_length = [nominal_volume, 0]|max / area %}
    {% set purge_length = params.LENGTH|default([nominal_length, min_purge]|max)|float %}
    {% set total_volume = purge_length * area %}
    {% set by_volume = ((total_volume / pfab_purge_unit_volume) + 0.5)|int %}
    {% set by_size = ((purge_length / max_blob_size)|round(0, 'ceil'))|int %}
    {% set pfab_parts = [pfab_max_parts, [1, by_volume]|max]|min %}
    {% set parts = [pfab_parts, by_size, 1]|max %}
    {% set unit_len = purge_length / parts %}
    {% set x_min = printer.toolhead.axis_minimum.x|float %}
    {% set x_max = printer.toolhead.axis_maximum.x|float %}
    {% if brush_left_pos < x_min or flush_pos > x_max or anti_drip_pos < brush_left_pos or anti_drip_pos > flush_pos %}
        {action_raise_error("PFAB: configured X237/X252/X249 positions exceed printer travel or PFAB range")}
    {% endif %}
    {% set fast_speed = [brush_speed|float, printer.toolhead.max_velocity|float]|min %}
    # Save the currently ACTIVE acceleration (e.g. first-layer M204 S500).
    {% set accel_restore = printer.toolhead.max_accel|float %}
    # The configured machine max is independent of the slicer's active M204.
    {% set machine_max_accel = printer.configfile.settings.printer.max_accel|float %}
    {% set accel_use = [pfab_accel|float, machine_max_accel]|min %}
    {% set post = printer['gcode_macro _PFAB_POST_LOAD'] %}
    {% set fan_restore = post.fan_restrore|float if post.armed|int else printer['fan'].speed|float %}
    {% if purge_length <= 0 or parts < 1 %}
        {action_raise_error("PFAB: no purge length configured")}
    {% endif %}

    RESPOND MSG="PFAB: profile source T{tool}={found.new_source}, previous T{prev}={found.old_source}; HH state={mmu_state}"
    RESPOND MSG="PFAB: T{prev} > T{tool}, {purge_length|round(1)}mm ({total_volume|round(0)}mm3), {parts} sections, flow {high_flow|round(2)}mm3/s, flush {flush_temp|int}C"
    {% if high_flow < requested_flow %}
        RESPOND MSG="PFAB: flow capped {requested_flow|round(2)} -> {high_flow|round(2)} mm3/s by printer safety setting"
    {% endif %}
    {% if parts > pfab_max_parts %}
        RESPOND MSG="PFAB: more than four purge sections needed to respect 90mm physical section limit"
    {% endif %}

    SAVE_GCODE_STATE NAME=PFAB_PURGE_STATE
    G90
    M83
    SET_VELOCITY_LIMIT ACCEL={accel_use}
    MMU_RELEASE
    G0 X{flush_pos} F3000
    M109 S{flush_temp}
    M106 S{pfab_purge_fan}
    # Happy Hare begins with a parked/retracted extruder; undo this *once*.
    {% if park_retract > 0 %}
        G1 E{park_retract} F{[seq.unretract_speed|float, pfab_unretract_speed]|min * 60}
    {% endif %}

    {% for i in range(parts) %}
        {% if i == 0 %}
            _PFAB_FIRST LENGTH={unit_len} OLD_FLOW={first_flow} NEW_FLOW={high_flow} AREA={area} STRAIGHT={pfab_initial_straight_len}
            {% if old_retract > 0 %}
                G1 E-{old_retract} F{pfab_retract_speed * 60}
                G1 E{old_retract} F{pfab_unretract_speed * 60}
            {% endif %}
        {% elif i < parts - 1 %}
            M106 S{pfab_purge_fan}
            _PFAB_PULSED LENGTH={unit_len} FLOW={high_flow} AREA={area}
            {% if new_retract > 0 %}
                G1 E-{new_retract} F{pfab_retract_speed * 60}
                G1 E{new_retract} F{pfab_unretract_speed * 60}
            {% endif %}
        {% else %}
            M106 S{pfab_purge_fan}
            _PFAB_PULSED LENGTH={unit_len} FLOW={high_flow} AREA={area}
        {% endif %}
        # intermediate wiping is conditional on length of the preceding part.
        {% if i < parts - 1 and unit_len > 45 and unit_len > 1 %}
            _PFAB_WIPE CYCLES={pfab_inter_cycles} X_FAST={brush_left_pos} X_SLOW={flush_pos} FAST={fast_speed} SLOW={pfab_slow_speed} FAN={fan_speed} PAUSE={pause}
            _PFAB_COUNT
        {% endif %}
    {% endfor %}

    # final purge sequence: restore print temperature, compensate for
    # temperature-transition ooze, retract, then cool and shake four times.
    M400
    M106 S{pfab_purge_fan}
    M109 S{print_temp}
    G1 E{pfab_ooze_compensation} F{flow_fast}
    M400
    {% if new_retract > 0 %}
        G1 E-{new_retract} F{pfab_retract_speed * 60}
    {% endif %}
    _PFAB_WIPE CYCLES={brush_cycles} X_FAST={brush_left_pos} X_SLOW={flush_pos} FAST={fast_speed} SLOW={pfab_slow_speed} FAN={fan_speed} PAUSE={pause}
    _PFAB_COUNT
    G0 X{anti_drip_pos} F3000
    # Happy Hare needs to return to the EXACT parked retraction level that it
    # started with. Adjust AFTER blob ejection to avoid a missing restart prime.
    {% if new_retract > park_retract %}
        G1 E{new_retract - park_retract} F{pfab_unretract_speed * 60}
    {% elif park_retract > new_retract %}
        G1 E-{park_retract - new_retract} F{pfab_retract_speed * 60}
    {% endif %}
    M400
    M106 S{(fan_restore * 255)|round(0)|int}
    SET_VELOCITY_LIMIT ACCEL={accel_restore}
    RESTORE_GCODE_STATE NAME=PFAB_PURGE_STATE
    RESPOND MSG="PFAB: purge finished; original extrusion mode, fan and acceleration restored"

# First part follows reference: 23.7mm straight using OLD filament flow,
# then four cycles of 2% slow / 23% fast, with transition to NEW flow.
[gcode_macro _PFAB_FIRST]
gcode:
    {% set length = params.LENGTH|float %}
    {% set area = params.AREA|float %}
    {% set straight = params.STRAIGHT|float %}
    {% set old_f = params.OLD_FLOW|float / area * 60 %}
    {% set new_f = params.NEW_FLOW|float / area * 60 %}
    {% if length > straight %}
        G1 E{straight} F{old_f}
        {% set rest = length - straight %}
        G1 E{rest * 0.02} F50
        G1 E{rest * 0.23} F{old_f}
        {% for _ in range(3) %}
            G1 E{rest * 0.02} F50
            G1 E{rest * 0.23} F{new_f}
        {% endfor %}
    {% else %}
        G1 E{length} F{old_f}
    {% endif %}

# Subsequent purge parts: five [18% fast + 2% slow] pairs.
[gcode_macro _PFAB_PULSED]
gcode:
    {% set length = params.LENGTH|float %}
    {% set area = params.AREA|float %}
    {% set fast_f = params.FLOW|float / area * 60 %}
    {% for _ in range(5) %}
        G1 E{length * 0.18} F{fast_f}
        G1 E{length * 0.02} F50
    {% endfor %}

# Mechanical PFAB constraint: FAST 15mm to X237, SLOW 15mm back to X252.
[gcode_macro _PFAB_WIPE]
gcode:
    {% set cycles = params.CYCLES|int %}
    {% set fast = params.FAST|float %}
    {% set slow = params.SLOW|float %}
    M400
    M106 S{params.FAN|int}
    G4 P{params.PAUSE|int}
    {% for _ in range(cycles) %}
        G0 X{params.X_FAST|float} F{fast * 60}
        G0 X{params.X_SLOW|float} F{slow * 60}
    {% endfor %}
    M400
    M106 S0

# ---------------------------------------------------------------------------
# Original parking interface: original geometry/feedrates unchanged.
# During parking TO the purge area, use PFAB acceleration independently of
# the slicer's current first-layer M204. RESTORE=1 uses original acceleration.
# ---------------------------------------------------------------------------
[gcode_macro PFAB_PARK]
variable_slow_speed: 200
variable_approach_dist: 30
gcode:
    {% set slow_f = slow_speed * 60 %}
    {% set fast_f = params.F|default(3000) %}
    {% set park_restore = params.RESTORE|default(0)|int == 1 %}
    {% if not park_restore %}
        {% set original_accel = printer.toolhead.max_accel|float %}
        {% set pfab_accel = printer['gcode_macro _PFAB_PURGE'].pfab_accel|float %}
        {% set machine_max_accel = printer.configfile.settings.printer.max_accel|float %}
        SET_VELOCITY_LIMIT ACCEL={[pfab_accel, machine_max_accel]|min}
    {% endif %}
    {% set X_current = printer.toolhead.position.x|float %}
    {% set Y_current = printer.toolhead.position.y|float %}
    {% set X_target = params.X|float %}
    {% set Y_target = params.Y|float %}
    {% if X_target == -999 %}
        {% set X_target = X_current %}
    {% endif %}
    {% if Y_target == -999 %}
        {% set Y_target = Y_current %}
    {% endif %}
    {% if params.RESTORE|default(0)|int == 1 %}
        G1 X{X_target} Y{Y_target} F{fast_f}
    {% else %}
        {% set dist = (X_target - X_current)|abs %}
        {% if dist > approach_dist %}
            {% if X_target > X_current %}
                {% set X_fast_point = X_target - approach_dist %}
            {% else %}
                {% set X_fast_point = X_target + approach_dist %}
            {% endif %}
            G1 X{X_fast_point} F{fast_f}
            G1 X{X_target} Y{Y_target} F{slow_f}
        {% else %}
            G1 X{X_target} Y{Y_target} F{slow_f}
        {% endif %}
    {% endif %}
    {% if not park_restore %}
        M400
        SET_VELOCITY_LIMIT ACCEL={original_accel}
    {% endif %}

# ---------------------------------------------------------------------------
# Existing bucket count, persistent state and virtual sensor.
# ---------------------------------------------------------------------------
[gcode_macro _PFAB_COUNT]
variable_current_blobs: 0
variable_last_shake: 0
variable_next_shake: 0
gcode:
    {% set pf = printer['gcode_macro _PFAB_PURGE'] %}
    {% if current_blobs >= pf.max_blobs %}
        {action_respond_info("PFAB: Empty purge bucket!")}
        M117 Empty purge bucket!
        MMU_PAUSE MSG="Empty purge bucket!"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_PFAB_COUNT VARIABLE=current_blobs VALUE={current_blobs + 1}
        _PFAB_SAVE_STATE
        {% set percent = ((current_blobs + 1) / pf.max_blobs * 100) | round(1) %}
        UPDATE_PFAB_BUCKET_VPIN PERCENT={percent}
        {action_respond_info("PFAB: Blobs in bucket: %s/%s (%s%%)"%(current_blobs + 1, pf.max_blobs, percent))}
    {% endif %}

[gcode_macro _PFAB_COUNT_RESET]
gcode:
    SET_GCODE_VARIABLE MACRO=_PFAB_COUNT VARIABLE=current_blobs VALUE=0
    SET_GCODE_VARIABLE MACRO=_PFAB_COUNT VARIABLE=last_shake VALUE=0
    _PFAB_SAVE_STATE
    UPDATE_PFAB_BUCKET_VPIN PERCENT=0

[gcode_macro PURGE_BUCKET_EMPTY]
gcode:
    _PFAB_COUNT_RESET

[delayed_gcode PFAB_LOAD_STATE]
initial_duration: 2.0
gcode:
    {% set pf = printer['gcode_macro _PFAB_PURGE'] %}
    {% set sv = printer.save_variables.variables.pfab|default({}) %}
    {% if sv %}
        SET_GCODE_VARIABLE MACRO=_PFAB_COUNT VARIABLE=last_shake VALUE={sv.last_shake}
        SET_GCODE_VARIABLE MACRO=_PFAB_COUNT VARIABLE=current_blobs VALUE={sv.current_blobs}
        {% set percent = (sv.current_blobs / pf.max_blobs * 100) | round(1) %}
        UPDATE_PFAB_BUCKET_VPIN PERCENT={percent}
        {action_respond_info("PFAB: Blobs in bucket: %s/%s (%s%%)"%(sv.current_blobs, pf.max_blobs, percent))}
    {% endif %}

[gcode_macro _PFAB_SAVE_STATE]
gcode:
    {% set c = printer['gcode_macro _PFAB_COUNT'] %}
    {% set sv = {'current_blobs': c.current_blobs, 'last_shake': c.last_shake} %}
    SAVE_VARIABLE VARIABLE=pfab VALUE="{sv}"

# ---------------------------------------------------------------------------
# Existing Happy Hare hooks; preserve names and do not change caller sites.
# No blind 10C temperature drop: the routine uses the explicit material flush temp.
# ---------------------------------------------------------------------------
[gcode_macro _PFAB_POST_FORM_TIP]
gcode:
    {% set saved_target = printer.extruder.target|float %}
    {% set saved_fan = printer['fan'].speed|float %}
    SET_GCODE_VARIABLE MACRO=_PFAB_POST_LOAD VARIABLE=fan_restrore VALUE={saved_fan}
    SET_GCODE_VARIABLE MACRO=_PFAB_POST_LOAD VARIABLE=temp_restore VALUE={saved_target}
    SET_GCODE_VARIABLE MACRO=_PFAB_POST_LOAD VARIABLE=armed VALUE=1

[gcode_macro _PFAB_PRE_LOAD]
variable_initial_load: 1
gcode:
    # Reserved compatibility hook.

[gcode_macro _PFAB_POST_LOAD]
variable_fan_restrore: 0.0    # retain original misspelled variable name for compatibility
variable_temp_restore: 235.0
variable_armed: 0
gcode:
    # Purge already restores the print temperature via M109. If purge was
    # skipped, Happy Hare owns the heater. Do not force an old filament's temp.
    {% if armed|int %}
        M106 S{(fan_restrore * 255)|round(0)|int}
        SET_GCODE_VARIABLE MACRO=_PFAB_POST_LOAD VARIABLE=armed VALUE=0
    {% endif %}

# ============================================================================
# End of single-file PFAB configuration.
# ============================================================================
